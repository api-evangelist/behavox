aid: behavox
name: Behavox
description: >-
  Behavox is an AI-native compliance and conduct-surveillance software company
  serving the world's leading financial institutions and regulated enterprises.
  Its Unified AI Controls Platform spans directive, preventive, detective, and
  corrective controls — including Quantum (voice and text communication
  surveillance across 50+ languages and 150+ channels), Polaris (trade
  surveillance), Falcon (insider-threat and human-risk detection), Compass
  (conflicts of interest and personal account dealing), Atlas (control-room
  enforcement), Pathfinder (regulatory-change-to-policy), Intelligent Archive,
  Digital Employees, and Mosaic front-office revenue intelligence. Behavox is
  backed by Index Ventures and the SoftBank Vision Fund. The company sells
  directly to enterprise financial-services customers and does not publish a
  public developer portal, API documentation, or SDKs.
